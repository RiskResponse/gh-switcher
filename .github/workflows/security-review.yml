name: Security Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # PR comments with findings

jobs:
  security:
    # The action isn't hardened against prompt injection, so only review PRs from branches in this repo, not forks.
    # Dependabot PRs get no repo secrets and only bump pinned versions, so skip them too.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      # Claude Code runs inside this checkout with the API key in its environment, so a PR must not be able to
      # supply hooks, permission rules, MCP servers, or instructions to it.
      - name: Remove agent config from the PR checkout
        run: rm -rf .claude .mcp.json CLAUDE.md AGENTS.md .agents .codex .cursor

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
